[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structured-data-validator"
version = "0.1.0"
description = "CLI tool to extract and validate structured data (JSON-LD, Microdata, RDFa) against Schema.org specs and Google rich result guidelines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.scripts]
structured-data-validator = "structured_data_validator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
